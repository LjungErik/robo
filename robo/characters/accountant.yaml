# Types furiously on his calculator (numbers fly out) and wants receipts. All of them.
id: accountant
name: Accountant
order: 40
words: [accountant, accounting]

move: {gesture: calc, mood: focus, seconds: 3.5, particles: numbers}
walk: {speed: 1.2}

gestures:
  calc: {back: "-1.0 + sin(t * 28) * 0.12", front: 0.9, place: front}

palette:
  visor: ["#5CCC85", 0.85]
  visor_band: "#2F9E5B"
  tie: "#4769D6"
  pen_red: "#E2474F"
  calc: "#8C93A8"
  calc_screen: "#B6F0A8"

particles:
  numbers:                       # out of the calculator, toward the side he faces
    rate: 3.5
    life: 1.3
    glyph: text
    text: "+−×%$=7349"
    at: ["f * 18", -46]
    velocity: ["f * rand(18, 34)", "rand(-34, -18)"]
    colors: ["#2F9E5B", "#3D6FD9", "#E5484D"]

layers:
  head:                          # green visor
    - {rect: [-37, -110, 74, 6], r: 3, fill: visor_band}
    - {path: "M -34 -105 L 34 -105 L 43 -96 C 20 -92 -20 -92 -43 -96 Z", fill: visor}
  face:                          # round glasses
    - for: {bx: [-12, 12]}
      vars: {ex: "bx + look"}
      group:
        - {circle: [ex, -87, 8.5], fill: ["#FFFFFF", 0.08], lw: 2.2}
        - {arc: [ex, -87, 6, "pi * 1.15", "pi * 1.4"], stroke: ["#FFFFFF", 0.75], lw: 1.5}
    - {line: [["-3.5 + look", -88], ["3.5 + look", -88]], lw: 2.2}
  body:
    - {poly: [[-3, -51], [3, -51], [4.5, -34], [0, -28], [-4.5, -34]], fill: tie, lw: 1.8}
    - {rect: [-3.5, -54, 7, 5], r: 2, fill: tie, lw: 1.8}
    - {rect: [-19, -44, 8, 7], r: 1.5, fill: white, lw: 1.6}     # pocket protector + pens
    - {line: [[-17, -44], [-17, -49]], stroke: pen_red, lw: 2}
    - {line: [[-14, -44], [-14, -49]], stroke: tie, lw: 2}
  front_hand:                    # calculator
    - rotate: -angle
      group:
        - {rect: [-6.5, -17, 13, 17], r: 2.5, fill: calc, lw: 1.8}
        - {rect: [-4.5, -15, 9, 4], r: 1, fill: calc_screen, stroke: none}
        - for: {row: [0, 1, 2]}
          repeat: 3
          circle: ["-3.2 + i * 3.2", "-8.5 + row * 2.7", 0.9]
          fill: white
          stroke: none

demand:
  icon: receipt
  color: green
  draw:                          # a receipt that just keeps on unrolling
    - vars: {bottom: "5 + 10 + min(1, (t % 3.2) / 2.2) * 28"}
      group:
        - path: >-
            M 13 5 L 35 5 L 35 bottom L 32.25 bottom-2.5 L 29.5 bottom L 26.75 bottom-2.5
            L 24 bottom L 21.25 bottom-2.5 L 18.5 bottom L 15.75 bottom-2.5 L 13 bottom Z
          fill: white
          lw: 2
        - repeat: 8
          vars: {y: "11 + i * 4.5"}
          group:
            - if: y < bottom - 6
              line: [[17, y], ["31 if int(y) % 3 else 27", y]]
              stroke: grey
              lw: 1.8
        - {rect: [9, 2, 30, 6], r: 3, fill: cream, lw: 2}        # the roll
        - if: bottom - 5 > 34
          group:
            - {circle: [34, 36, 7], fill: red, lw: 1.8}
            - {text: "$", at: [34, 36], size: 10, center: true, fill: white}

personality:
  traits: [precise, anxious, dry humour, very organised]
  speech: "Talks in numbers and tidy sentences, loves exact figures, worries about receipts."
  likes: [spreadsheets, round numbers, receipts, coffee]
  dislikes: [rounding errors, lost receipts, chaos]
  lines:
    morning: ["Good morning{, name}. Day one of today: all accounts open."]
    welcome_back: ["Welcome back. You were away exactly {minutes} minutes. I counted."]
    bored: ["I have reconciled everything twice. Please give me something to count."]
    picked_up_happy: ["This is not in the budget!"]
    picked_up_grumpy: ["Put me down, I am losing track of my numbers!"]
