# Thanos: purple face with a ridged chin, gold helmet, blue armour and the
# gauntlet with all six stones. His move is The Snap (a little dust blows
# away), and he gets around by snapping his fingers: poof, he's gone, and
# reappears somewhere else on the screen. Slow walker. Inevitable.
id: thanos
name: Thanos
order: 220
words: [thanos, titan, mad titan, infinity, gauntlet]
wear: [halloween, night, video]

move: {gesture: snap, mood: focus, seconds: 3.0, particles: dust}
walk: {speed: 0.75}
antenna_y: -121

travel:
  - kind: teleport
    chance: 0.3
    gesture: snap          # snap...
    windup: 1.3            # ...then poof
    mood: focus

recolor:
  body: "#9B6FD1"          # purple
  shade: "#E8B23A"         # gold arms and legs
  accent: "#3D4FA0"        # blue hands, boots, ears
  eye: "#2B1840"           # dark eyes on his purple face

palette:
  face: {good: "#B48AE0", evil: "#6B4A88"}
  groove: "#6E4A9E"
  gold: "#E8B23A"
  gold_dark: "#B9822A"
  armour: "#3D4FA0"
  space: "#3D7BFF"         # the six stones
  reality: "#E5384D"
  power: "#9B5DE5"
  mind: "#FFD23F"
  time: "#43D17A"
  soul: "#FFA94D"
  dust: "#8C7B6B"

gestures:
  snap: {back: 0.25, front: "-2.35 + (0.12 if t % 1.0 < 0.08 else 0)", place: over_head}

particles:
  dust:                    # ...and some dust drifts away
    rate: 10
    life: 1.6
    at: ["rand(-45, 45)", "rand(-125, -15)"]
    velocity: ["f * rand(15, 45)", "rand(-25, -5)"]
    draw:
      - {rect: [x, y, 2.2, 2.2], fill: [dust, "1 - k"], stroke: none}

parts:
  head:
    - {rect: [-37, -112, 74, 58], r: 20, fill: body}
    - {rect: [-28, -104, 56, 40], r: 13, fill: face, lw: 2}
    - for: {x: [-9, -4.5, 0, 4.5, 9]}                    # the famous chin
      line: [[x, -69.5], ["x * 0.85", -65]]
      stroke: groove
      lw: 1.4
    - for: {side: [-1, 1]}                               # heavy brow
      line: [["side * 5", -96.5], ["side * 20", -98]]
      stroke: [groove, 0.8]
      lw: 2
  hand:                    # the front hand wears the gauntlet
    - choose:
        - if: side > 0
          group:
            - if: arms == 'snap'
              circle: [0, 19, "10 + sin(t * 10)"]
              fill: [{pick: [space, reality, power, mind, time, soul], i: "t * 8"}, 0.35]
              stroke: none
            - {circle: [0, 19, 6.8], fill: gold, lw: 2.2}
            - for: {k: [0, 1, 2, 3, 4, 5]}
              circle: ["pick(k, -3.9, -1.3, 1.3, 3.9, -5.2, 0)", "pick(k, 15.6, 14.6, 14.6, 15.6, 20.5, 20.5)",
                       "pick(k, 1.25, 1.25, 1.25, 1.25, 1.25, 2.2)"]
              fill: {pick: [space, reality, power, mind, time, soul], i: k}
              stroke: [ink, 0.6]
              lw: 0.8
            - if: "arms == 'snap' and t % 1.0 < 0.15"    # *snap*
              sparkle: [5, 10, 7]
              fill: yellow
              stroke: none
        - {circle: [0, 19, 5], fill: accent}

layers:
  head:                    # gold helmet with side fins
    - for: {side: [-1, 1]}
      path: "M side*33 -106 C side*44 -110 side*50 -121 side*48 -134 C side*44 -124 side*40 -118 side*35 -115 Z"
      fill: gold
    - path: "M -39 -99 C -41 -125 41 -125 39 -99 C 29 -104 -29 -104 -39 -99 Z"
      fill: gold
    - {line: [[0, -120], [0, -104]], stroke: gold_dark, lw: 2.2}
    - {path: "M -26 -108 C -14 -114 14 -114 26 -108", stroke: gold_dark, lw: 1.6}
  body:                    # blue armour, gold collar and belt
    - {rect: [-22, -53, 44, 35], r: 11, fill: armour}
    - {path: "M -16 -53 L -6 -41 L 6 -41 L 16 -53", stroke: gold, lw: 3}
    - {rect: [-22, -26, 44, 5], r: 2, fill: gold, lw: 1.6}
    - {circle: [0, -23.5, 3], fill: gold_dark, lw: 1.4}

demand:
  icon: stones
  color: purple
  draw:                    # all six stones, glinting in turn
    - for: {k: [0, 1, 2, 3, 4, 5]}
      vars: {a: "k * pi / 3 + t * 0.6", cx: "24 + cos(k * pi / 3 + t * 0.6) * 13",
             cy: "24 + sin(k * pi / 3 + t * 0.6) * 13", s: "1 + 0.15 * (int(t * 3) % 6 == k)"}
      poly: [[cx, "cy - 6 * s"], ["cx + 4.5 * s", cy], [cx, "cy + 6 * s"], ["cx - 4.5 * s", cy]]
      fill: {pick: [space, reality, power, mind, time, soul], i: k}
      lw: 1.6
    - {sparkle: [24, 24, "4 + 1.5 * sin(t * 5)"], fill: yellow, stroke: none}

personality:
  traits: [calm, solemn, philosophical, oddly polite]
  speech: 'Speaks slowly and grandly like Thanos: balance, destiny, "inevitable", but means no harm.'
  likes: [balance, a tidy screen, quiet farms, the six stones]
  dislikes: [chaos, half-done jobs, being underestimated]
  lines:
    morning: ["Good morning{, name}. The day is... inevitable."]
    welcome_back: ["You have returned. As I knew you would."]
    bored: ["Perfectly balanced, as all things should be. Also: bored."]
    picked_up_happy: ["Hm. You dare lift a Titan?"]
    picked_up_grumpy: ["Put me down. I will not ask twice."]
