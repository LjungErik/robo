# Flies up, fist first, cape trailing; looking for a kitten to rescue.
id: superhero
name: Superhero
order: 110
words: [superhero, super hero, hero]

move: {gesture: fly, mood: happy, seconds: 3.5, particles: stars,
       lift: "26 + sin(t * 3) * 3", tilt: 0.22}
walk: {speed: 1.6}
travel:
  # now and then he really takes off and flies somewhere else on the screen
  - {kind: fly, chance: 0.15, speed: 170, gesture: fly, hover_gesture: hover, tilt: 0.22,
     stay: [2, 5], hops: [1, 2]}

palette:
  cape: "#E5484D"
  gold: "#F5C542"
  mask: "#2E4BB5"
  orange_cat: "#FFA94D"
  cat_pink: "#FF9CC2"
  nose: "#FF7AB6"

particles:
  stars:
    rate: 4
    life: 1.4
    glyph: star
    at: ["rand(-48, 48)", "rand(-140, -20)"]
    velocity: [0, "rand(-8, -2)"]

layers:
  behind:                                    # cape (streams out behind him in flight)
    - vars:
        fast: "arms == 'fly' or lift > 8 or airborne"
        trail: "-16 if arms == 'fly' or lift > 8 or airborne else 0"
        wave: "sin(t * 9) * 4 if arms == 'fly' or lift > 8 or airborne else sin(t * 2.5) * 1.5"
      path: >-
        M -19 -52 C -28 -38 -34+trail*0.5 -22+wave -32+trail -6+wave
        C -14+trail -2-wave 10+trail*0.5 -4+wave 28+trail*0.3 -8 C 28 -24 26 -40 19 -52 Z
      fill: cape
  body:
    - {rect: [-22, -26, 44, 5], r: 2, fill: gold, lw: 1.6}           # belt
    - {circle: [0, -39, 8.5], fill: gold}                             # emblem
    - poly: [[1.5, -45.5], [-3.5, -38.5], [0, -38.5], [-1.5, -32.5], [3.5, -40], [0, -40]]
      fill: cape
      stroke: none
  face:                                      # mask with eye holes
    - even_odd: true
      compound:
        - {rect: ["-27 + look", -95, 54, 16], r: 8}
        - {ellipse: ["-12 + look", -87, 7, 6.2]}
        - {ellipse: ["12 + look", -87, 7, 6.2]}
      fill: mask
      lw: 1.6

demand:
  icon: kitten
  color: orange
  draw:
    - vars: {blink: "(t % 3) < 0.15"}
      group:
        - for: {side: [-1, 1]}
          group:
            - poly: [["24 + side * 13", 22], ["24 + side * 12", 7], ["24 + side * 3", 15]]
              fill: orange_cat
            - poly: [["24 + side * 11", 18], ["24 + side * 10.5", 11], ["24 + side * 6", 15]]
              fill: cat_pink
              stroke: none
        - {ellipse: [24, 27, 15, 12.5], fill: orange_cat}
        - for: {x: [18, 30]}
          choose:
            - if: blink
              line: [["x - 2.5", 26], ["x + 2.5", 26]]
              lw: 2
            - group:
                - {ellipse: [x, 26, 2.8, 3.6], fill: ink, stroke: none}
                - {circle: ["x - 0.9", 24.6, 1.1], fill: white, stroke: none}
        - {poly: [[22.5, 30], [25.5, 30], [24, 31.8]], fill: nose, stroke: none}
        - {path: "A 22 32 2 0 pi S A 26 32 2 0 pi", lw: 1.4}
        - for: {side: [-1, 1]}                # whiskers
          group:
            - for: {dy: [-1.5, 1.5]}
              line: [["24 + side * 8", "31 + dy * 0.3"], ["24 + side * 17", "30 + dy * 1.6"]]
              lw: 1
        - repeat: 2                           # little "help!" pleas
          vars: {k: "(t * 0.8 + i / 2) % 1"}
          sparkle: ["40 - i * 32", "10 - k * 6", "3 * (1 - k)"]
          fill: yellow
          stroke: none
