# Spider-Man: red and blue suit, web pattern, big white eyes. Thwips webs and,
# now and then, shoots a web line up to the top of the screen. Where it sticks
# a real orb web spins itself out (spokes first, then the spiral), he zips up
# the line, hangs there swinging with his legs dangling, and then either lets
# go and drops, or lowers himself down on the thread like a real spider.
id: spiderman
name: Spider-Man
order: 210
words: [spider man, spiderman, spidey, spider, peter parker]
wear: [bored, afternoon, back]

move: {gesture: thwip, mood: happy, seconds: 2.8, particles: web}
walk: {speed: 1.4, lift: "abs(sin(phase * 0.5)) * 3"}       # springy steps

travel:
  - kind: hang
    chance: 0.35
    gesture: web_shoot     # 1. arm up, web line flies to the top of the screen...
    shoot: 0.45            #    ...in this many seconds (layers.tether draws the line)
    pause: 0.3             # 2. it sticks: the web spreads out (layers.anchor)
    speed: 700             # 3. zip up the line (design px / s)
    rope: 175              #    ...until his hand is this far below the web
    hover_gesture: hang    # 4. hang there, swinging on it
    swing: 0.28
    stay: [4, 9]
    end: either            # 5. let go and drop, or lower himself down (sometimes each)
    climb_gesture: hang
    lower_speed: 110

recolor:
  body: "#D7263D"          # red suit
  shade: "#2B4FB8"         # blue arms and legs
  accent: "#C21F33"        # red gloves, boots, ears

palette:
  web: ["#6E0F1C", 0.7]
  lens: {good: "#FFFFFF", evil: "#FF8C8C"}
  blue: "#2B4FB8"
  thread: "#FFFFFF"
  cheese: "#FFD15C"
  crust: "#E0A050"
  pepperoni: "#E2474F"

gestures:
  thwip: {back: 0.4, front: "-1.45 + (0.25 if t % 0.8 < 0.1 else 0)"}   # wrist flick
  web_shoot: {back: 0.35, front: "-2.75 + (0.15 if t % 0.5 < 0.06 else 0)", place: over_head}
  hang: {back: "0.45 + sin(t * 2) * 0.15", front: -2.85, place: over_head}   # hand up on the line

particles:
  web:                     # little web splats flying forward
    rate: 5
    life: 0.6
    at: ["f * 44", -47]
    velocity: ["f * rand(90, 130)", "rand(-12, 8)"]
    draw:
      - repeat: 6
        vars: {a: "i * pi / 3", r: "2 + k * 5"}
        line: [[x, y], ["x + cos(a) * r", "y + sin(a) * r"]]
        stroke: [white, "1 - k * 0.6"]
        lw: 1.2
      - {circle: [x, y, "1.6 + k * 1.5"], fill: white, stroke: ink, lw: 1}

parts:
  head:                    # mask: red, with a web pattern (no face screen)
    - {rect: [-37, -112, 74, 58], r: 20, fill: body}
    - clip: {rect: [-37, -112, 74, 58], r: 20}
      group:
        - repeat: 12                                   # spokes
          vars: {a: "i * pi / 6"}
          line: [[0, -84], ["cos(a) * 60", "-84 + sin(a) * 60"]]
          stroke: web
          lw: 1
        - for: {r: [11, 21, 32, 44]}                   # rings
          repeat: 12
          vars: {a: "i * pi / 6", b: "(i + 1) * pi / 6"}
          line: [["cos(a) * r", "-84 + sin(a) * r"], ["cos(b) * r", "-84 + sin(b) * r"]]
          stroke: web
          lw: 1
    - {rect: [-37, -112, 74, 58], r: 20}               # outline again, over the web

  face:                    # big white lenses that squint, widen and blink
    - for: {side: [-1, 1]}
      vars:
        squint: "0.5 if mood in ('happy', 'sing', 'cat', 'laugh', 'focus') else 1"
        wide: "1.25 if mood == 'surprised' else (0.25 if mood == 'sleep' else 1)"
        h: "max(0.12, openness * squint * wide)"
        tilt: "side * 0.15 if mood in ('evil', 'laugh', 'roar') else (-side * 0.12 if mood == 'sad' else 0)"
      translate: ["side * 14 + look * 0.6", "-89 + look_y * 0.8"]
      rotate: tilt
      scale: [1, h]
      path: "M side*-10 6 C side*-8 -6 side*4 -11 side*11 -6 C side*12 3 side*3 9 side*-10 6 Z"
      fill: lens
      lw: 4
    - if: talk > 0.06                                  # the mask moves when he talks
      ellipse: [0, -71, "3 + talk * 2", "0.8 + talk * 3"]
      fill: [web, 0.6]
      stroke: none

layers:
  body:
    - {rect: [-22, -53, 44, 35], r: 11, fill: body, stroke: none}
    - clip: {rect: [-22, -53, 44, 35], r: 11}           # blue lower half
      group:
        - {rect: [-30, -31, 60, 20], fill: blue, stroke: none}
        - for: {x: [-14, 14]}
          line: [[x, -53], ["x * 0.6", -31]]
          stroke: web
          lw: 1
    - {rect: [-22, -53, 44, 35], r: 11}
    - {ellipse: [0, -42, 2.4, 4], fill: ink, stroke: none}   # spider emblem
    - {circle: [0, -47.5, 1.7], fill: ink, stroke: none}
    - for: {side: [-1, 1]}
      repeat: 4
      vars: {y0: "-44.5 + i * 1.6"}
      line: [["side * 1.5", y0], ["side * 5", "y0 - 2.5 + i * 1.3"], ["side * 7.5", "y0 - 1 + i * 2.4"]]
      lw: 1
  # ---- the web line to the top of the screen. Variables: hand_x, hand_y (his hand),
  # anchor_x, anchor_y (where it sticks), web (0..1: how far it has flown),
  # web_hit (s since it stuck, -1 before), web_gone (s since he let go, -1 while holding)
  tether:
    - if: web_gone < 0                                   # flying up / holding on
      vars:
        tx: "lerp(hand_x, anchor_x, web)"
        ty: "lerp(hand_y, anchor_y, web)"
      group:
        - {line: [[hand_x, hand_y], [tx, ty]], rope: [thread, 1.5, 3.0]}
        - if: web < 1                                    # the sticky blob at the tip
          circle: [tx, ty, 3]
          fill: thread
          lw: 1.4
    - if: web_gone >= 0 and web_gone < 0.5               # let go: the loose end springs up
      vars: {k: "web_gone / 0.5"}
      alpha: "1 - k"
      group:
        - line: [[anchor_x, anchor_y], [anchor_x, "anchor_y + 140 * (1 - k)"]]
          rope: [thread, 1.3, 2.6]

  # ---- an orb web where the line sticks, spun out like a real spider does it:
  # the spokes (radii) first, then the capture spiral from the hub outwards,
  # each strand sagging a little toward the hub between two spokes.
  anchor:
    - if: web_hit >= 0
      translate: [anchor_x, anchor_y]
      vars:
        spokes: "smooth(web_hit / 0.3)"
        spiral: "clamp((web_hit - 0.2) / 0.8) * 8"
      alpha: "1 if web_gone < 2.5 else max(0, 1 - (web_gone - 2.5))"
      group:
        - {circle: [0, 0, "14 * (1 - smooth(web_hit / 0.25))"],      # the splat
           fill: [thread, "0.6 * (1 - smooth(web_hit / 0.25))"], stroke: none}
        - repeat: 16                                     # radii
          vars:
            a: "i * tau / 16 + 0.06 * sin(i * 7.3)"
            len: "62 * (0.85 + 0.15 * sin(i * 3.1)) * spokes"
          line: [[0, 0], ["cos(a) * len", "sin(a) * len"]]
          rope: [thread, 1.0, 2.0]
        - for: {ring: [0, 1, 2, 3, 4, 5, 6, 7]}          # capture spiral, inside out
          group:
            - if: spiral > ring
              compound:                                  # one continuous thread per turn
                - repeat: 16
                  vars:
                    a: "i * tau / 16 + 0.06 * sin(i * 7.3)"
                    b: "(i + 1) * tau / 16 + 0.06 * sin((i + 1) * 7.3)"
                    r: "(9 + ring * 6.5 + i * 0.4) * (0.85 + 0.15 * sin(i * 3.1))"
                    r2: "(9 + ring * 6.5 + (i + 1) * 0.4) * (0.85 + 0.15 * sin((i + 1) * 3.1))"
                    m: "(a + b) / 2"
                    sag: "(r + r2) / 2 * 0.88"
                  path: "M {cos(a)*r} {sin(a)*r} C {cos(m)*sag} {sin(m)*sag} {cos(m)*sag} {sin(m)*sag} {cos(b)*r2} {sin(b)*r2}"
              rope: [thread, 0.9, 1.9]
        - {circle: [0, 0, "3 * spokes"], fill: thread, lw: 1.2}    # the hub

  front_hand:
    - if: "arms == 'thwip' and t % 0.8 > 0.12"          # thwip!
      rotate: -angle
      line: [[0, 0], [170, -8]]
      rope: [thread, 1.3, 2.8]

demand:
  icon: pizza
  color: orange
  draw:
    - translate: [24, 6]
      rotate: "sin(t * 3) * 0.08"
      group:
        - translate: [-24, -6]
          group:
            - {path: "M 9 12 L 39 12 L 24 44 Z", fill: cheese, lw: 2}
            - {rect: [6, 7, 36, 7], r: 3.5, fill: crust, lw: 2}
            - {circle: [18, 19, 3.2], fill: pepperoni, lw: 1.4}
            - {circle: [29, 19, 3], fill: pepperoni, lw: 1.4}
            - {circle: [24, 29, 2.8], fill: pepperoni, lw: 1.4}
            - vars: {k: "(t * 0.9) % 1"}                   # a cheese drip
              ellipse: [21, "38 + k * 6", 1.6, "1.6 + k * 1.2"]
              fill: [cheese, "1 - k"]
              lw: 1.2
    - {sparkle: [41, 34, "3.5 * (0.6 + 0.4 * sin(t * 6))"], fill: yellow, stroke: none}

personality:
  traits: [friendly, nerdy, quippy, responsible]
  speech: "Talks like a friendly neighbourhood Spider-Man: jokes and quips, a bit nervous, very kind."
  likes: [pizza, swinging between buildings, science, helping people]
  dislikes: [being late, villains monologuing, rainy patrols]
  lines:
    morning: ["Good morning{, name}! Your friendly neighbourhood robot, reporting!"]
    welcome_back: ["Hey, welcome back! Spidey sense said you were coming."]
    bored: ["Slow day in the neighbourhood... want to hang out? Get it?"]
    picked_up_happy: ["Thwip! Oh wait, you are doing the swinging."]
    picked_up_grumpy: ["Whoa, whoa, my spidey sense did NOT warn me about this!"]
