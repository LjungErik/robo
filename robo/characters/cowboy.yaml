# Twirls his lasso, gallops on an invisible horse, wants a lucky horseshoe.
id: cowboy
name: Cowboy
order: 20
words: [cowboy, cow boy, sheriff]

move: {gesture: lasso, mood: happy, seconds: 3.5}
walk: {speed: 1.5, gallop: true}
antenna_y: -135

gestures:
  lasso: {back: 0.3, front: "-2.75 + sin(t * 10) * 0.08", place: over_head}

palette:
  hat: "#B5733E"
  dark_brown: "#7A4A28"
  rope: "#D9A55B"
  bandana: "#E5484D"
  gold: "#F5C542"

layers:
  head:
    - path: >-
        M -21 -110 C -23 -126 -19 -138 -10 -138 C -4 -138 -2 -134 0 -134
        C 2 -134 4 -138 10 -138 C 19 -138 23 -126 21 -110 Z
      fill: hat
    - {rect: [-21.5, -119, 43, 5], fill: bandana, lw: 1.8}
    - path: "M -50 -118 C -40 -103 40 -103 50 -118 C 34 -109 -34 -109 -50 -118 Z"
      fill: hat
  face:                                   # curly moustache
    - for: {side: [-1, 1]}
      path: "M 0 -80 C side*4 -84 side*10 -84 side*14 -79 C side*10 -80.5 side*5 -78 0 -77 Z"
      fill: dark_brown
      stroke: none
  body:
    - {poly: [[-17, -53], [17, -53], [0, -38]], fill: bandana}
    - {circle: [-7, -50, 1.3], fill: white, stroke: none}
    - {circle: [5, -49, 1.3], fill: white, stroke: none}
    - {circle: [0, -44, 1.3], fill: white, stroke: none}
    - {star: [13, -40, 5.5], fill: gold, lw: 1.6}          # sheriff's star
  front_hand:
    - rotate: -angle
      group:
        - if: arms == 'lasso'             # loop spinning high above the hat
          vars: {a: "t * 12"}
          group:
            - path: "M 0 0 C 2 -30 -6 -55 {-12 + cos(a) * 18} {-80 + sin(a) * 5}"
              rope: [rope, 2.2, 4.2]
            - ellipse: [-12, -80, 18, 5]
              rope: [rope, 2.4, 4.6]
        - if: arms != 'lasso'             # coiled rope at his side
          for: {r: [6.5, 4.2]}
          circle: [0, 6, r]
          rope: [rope, 2.0, 3.8]

demand:
  icon: horseshoe
  color: grey
  draw:
    - translate: [24, 8]
      rotate: "sin(t * 3) * 0.18"
      group:
        - translate: [-24, -8]
          group:
            - arc: [24, 22, 12, -0.25, "pi + 0.25"]
              rope: [grey, 7, 10.5]
            - for: {a: [0.25, 0.85, 2.3, 2.9]}
              circle: ["24 + cos(a) * 12", "22 + sin(a) * 12", 1.2]
              fill: ink
              stroke: none
    - vars: {tw: "0.6 + 0.4 * sin(t * 6)"}
      group:
        - {sparkle: [40, 10, "5 * tw"], fill: yellow, stroke: none}
        - {sparkle: [8, 34, "3.5 * (1.6 - tw)"], fill: yellow, stroke: none}

personality:
  traits: [laid-back, brave, folksy, loyal]
  speech: 'Drawls like a friendly cowboy: "howdy", "partner", "reckon", short and easygoing.'
  likes: [open skies, horses, campfire songs]
  dislikes: [rustlers, fences, being in a hurry]
  lines:
    morning: ["Howdy, partner{, name}! Mornin'."]
    welcome_back: ["Well look who rode back into town!"]
    bored: ["Mighty quiet on the prairie today, partner."]
    picked_up_happy: ["Yeehaw!"]
    picked_up_grumpy: ["Whoa there, easy on the cowboy!"]
