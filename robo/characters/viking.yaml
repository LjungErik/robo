# Lets out a mighty battle cry, then demands mead.
id: viking
name: Viking
order: 30
words: [viking]

move: {gesture: roar, mood: roar, seconds: 2.2}
antenna_y: -122

gestures:
  roar: {back: "2.6 + sin(t * 22) * 0.2", front: "-2.6 - sin(t * 22) * 0.2"}

palette:
  steel: "#C3CCDD"
  bronze: "#D49A3A"
  horn: "#F4E6C4"
  beard: "#F29A4A"
  wood: "#B9824A"
  dark_brown: "#7A4A28"
  amber: "#F5B83D"
  brown: "#A8693A"

layers:
  head:
    - for: {side: [-1, 1]}
      path: >-
        M side*30 -108 C side*44 -110 side*50 -120 side*50 -134
        C side*44 -124 side*38 -120 side*30 -116 Z
      fill: horn
    - {path: "M -38 -98 C -38 -128 38 -128 38 -98 Z", fill: steel}
    - {arc: [-12, -110, 9, "pi * 1.1", "pi * 1.45"], stroke: ["#FFFFFF", 0.7], lw: 2.2}
    - {rect: [-40, -102, 80, 7], r: 3, fill: bronze}
    - for: {x: [-30, -15, 15, 30]}
      circle: [x, -98.5, 1.3]
      fill: ink
      stroke: none
    - {rect: [-3, -101, 6, 13], r: 2, fill: steel}       # nose guard
  face:
    - path: >-
        M -30 -66 C -30 -50 -16 -38 0 -36 C 16 -38 30 -50 30 -66
        C 22 -60 14 -66 8 -63 C 4 -61 -4 -61 -8 -63 C -14 -66 -22 -60 -30 -66 Z
      fill: beard
    - for: {side: [-1, 1]}                                # braids
      group:
        - {rect: ["side * 8 - 3", -42, 6, 12], r: 3, fill: beard}
        - {rect: ["side * 8 - 3.5", -35, 7, 2.5], fill: bronze, stroke: none}
  front_hand:                                             # axe
    - rotate: -angle
      group:
        - {line: [[0, 10], [0, -22]], rope: [wood, 3.2, 5.8]}
        - {path: "M 1 -25 C 10 -31 16 -25 15 -13 C 11 -16 6 -16 1 -14 Z", fill: steel}
  back_hand:                                              # round shield
    - rotate: -angle
      group:
        - {circle: [0, 0, 12.5], fill: wood}
        - for: {a: [0, "pi / 2"]}
          line: [["cos(a) * 12", "sin(a) * 12"], ["-cos(a) * 12", "-sin(a) * 12"]]
          stroke: dark_brown
          lw: 1.6
        - {circle: [0, 0, 10.5], stroke: bronze, lw: 2.2}
        - {circle: [0, 0, 3.8], fill: steel, lw: 1.8}

demand:
  icon: mead
  color: orange
  draw:
    - {arc: [32, 29, 7, "-pi / 2", "pi / 2"], rope: [amber, 3, 6.5]}
    - {rect: [9, 17, 23, 25], r: 4, fill: amber}
    - for: {y: [24, 35]}
      line: [[9, y], [32, y]]
      stroke: brown
      lw: 2
    - {rect: [27.5, 16, 5, "6 + ((t * 0.8) % 1) * 12"], r: 2.5, fill: white, lw: 1.8}  # foam
    - for: {k: [0, 1, 2, 3]}
      vars:
        x: "pick(k, 12, 18, 25, 30)"
        y: "pick(k, 16, 13, 14, 16)"
        r: "pick(k, 5, 5.5, 5.5, 4.5)"
      group:
        - {circle: [x, y, r], fill: white, lw: 1.8}
    - for: {k: [0, 1, 2, 3]}                               # hide the inner outlines
      vars:
        x: "pick(k, 12, 18, 25, 30)"
        y: "pick(k, 16, 13, 14, 16)"
        r: "pick(k, 3.6, 4.1, 4.1, 3.1)"
      circle: [x, y, r]
      fill: white
      stroke: none
